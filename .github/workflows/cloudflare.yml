name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        default: staging
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: 'false'
      DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      PLATFORM_DATABASE_ENABLED: ${{ vars.PLATFORM_DATABASE_ENABLED || 'false' }}
      PLATFORM_AUTH_ENABLED: ${{ vars.PLATFORM_AUTH_ENABLED || 'false' }}
      PLATFORM_PAYMENTS_ENABLED: ${{ vars.PLATFORM_PAYMENTS_ENABLED || 'false' }}
      PLATFORM_RELAYS_ENABLED: ${{ vars.PLATFORM_RELAYS_ENABLED || 'false' }}
      PLATFORM_ADMIN_USER_IDS: ${{ vars.PLATFORM_ADMIN_USER_IDS || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -- --mode "$DEPLOY_MODE"
      - run: npx cf deploy --prebuilt --mode "$DEPLOY_MODE" --dry-run
      - name: Migrate account, billing and relay database
        if: env.PLATFORM_DATABASE_ENABLED == 'true'
        run: node deploy/migrate-platform.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload game and emulator to R2
        if: env.DEPLOY_MODE == 'production'
        run: node deploy/upload-r2.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish Worker and static assets
        run: npx cf deploy --prebuilt --mode "$DEPLOY_MODE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
